name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The image pins the compilers: GCC 13 and Clang 18 on Ubuntu 24.04.
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v7
      # flite and espeak-ng let the tests hold yapper compile to compile.py.
      # The image's package lists usually suffice; refreshing them can take
      # minutes on a slow mirror, so that happens only if they are stale.
      - name: Install flite and espeak-ng
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get install -y --no-install-recommends flite espeak-ng ||
            { sudo apt-get update && sudo apt-get install -y --no-install-recommends flite espeak-ng; }
      - name: Build with warnings as errors
        run: |
          gcc -std=c11 -O2 -Wall -Wextra -Werror cli.c yapper.c compile.c pitch.c -o yapper -lm
          clang -std=c11 -O2 -Wall -Wextra -Werror cli.c yapper.c compile.c pitch.c -o yapper -lm
      - name: Test
        run: python3 test.py
      - name: Parity
        run: python3 tests/parity.py
